[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-weighted-history"
version = "0.1.0"
description = "Weighted-history simulation and estimation for LoL Bo3 and Bo5 series"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
weighted-history = "weighted_history.cli:main"

[tool.setuptools]
packages = ["weighted_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
